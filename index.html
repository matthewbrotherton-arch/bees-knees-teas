<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4a6b4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bees' Knees" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <title>The Bees' Knees Weekly Teas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: { 50: '#f4f7f4', 100: '#e4ebe4', 200: '#c8d8c8', 300: '#a3bea3', 500: '#5f855f', 600: '#4a6b4a', 700: '#3b553b' },
            honey: { 100: '#fef3c7', 500: '#d97706' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f4f7f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-stone-800 pb-28 min-h-screen">

  <!-- TOP HEADER -->
  <header class="bg-sage-600 text-white px-4 py-3 shadow-md sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <img src="icon.png" alt="🐝" class="w-9 h-9 rounded-xl border border-sage-400 object-cover" onerror="this.style.display='none'" />
      <div>
        <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight">The Bees' Knees Weekly Teas</h1>
        <p id="syncStatusText" class="text-xs text-sage-100">Connecting to Google Sheets...</p>
      </div>
    </div>
    <button type="button" onclick="syncWithSheet()" class="bg-sage-700 hover:bg-sage-500 active:scale-95 transition px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 flex-shrink-0">
      <span id="syncSpinner">🔄</span> Sync
    </button>
  </header>

  <!-- MAIN CONTAINER (Full width optimized for phones) -->
  <main class="max-w-xl mx-auto px-3 sm:px-4 pt-4 space-y-4">

    <!-- ================= TAB 1: DIARY & SPLIT CALORIE COUNTER ================= -->
    <section id="tab-diary" class="space-y-4">
      <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-sage-100">
        <div class="flex items-center justify-between mb-2.5">
          <button type="button" onclick="shiftWeek(-7)" class="p-1.5 rounded-lg bg-sage-50 text-sage-700 font-bold text-sm px-3">◀ Prev</button>
          <div class="text-center">
            <span id="currentMonthLabel" class="font-bold text-sm text-stone-700"></span>
            <input type="date" id="fullDatePicker" onchange="jumpToDate(this.value)" class="block mx-auto text-xs text-sage-600 bg-transparent underline cursor-pointer mt-0.5" />
          </div>
          <button type="button" onclick="shiftWeek(7)" class="p-1.5 rounded-lg bg-sage-50 text-sage-700 font-bold text-sm px-3">Next ▶</button>
        </div>
        <div id="weekStrip" class="grid grid-cols-7 gap-1 text-center"></div>
      </div>

      <div class="space-y-2">
        <div class="flex items-center justify-between px-1">
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-stone-500">🍲 Planned Meals & Teas</h3>
            <p id="selectedDateReadableMeals" class="text-xs font-semibold text-sage-700"></p>
          </div>
          <button type="button" onclick="openAddMealModal()" class="bg-sage-600 text-white font-bold py-2 px-3.5 rounded-xl shadow-sm text-xs">+ Add Meal / Tea</button>
        </div>
        <div id="diaryMealsList" class="space-y-2.5"></div>
      </div>

      <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-sage-100 space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h2 id="selectedDateReadable" class="text-sm font-bold text-stone-700">Today</h2>
          <button type="button" onclick="switchTab('settings')" class="text-[11px] font-semibold text-sage-600 underline">Edit Targets ⚙️</button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-sky-50 border border-sky-200 rounded-xl p-3 space-y-2">
            <div class="flex items-start justify-between">
              <div>
                <span class="text-xs font-extrabold uppercase text-sky-800 block">🧑 Matt</span>
                <span class="text-[10px] text-sky-600">Target: <b id="mattTargetDisplay">2200 kcal</b></span>
              </div>
              <div class="text-right">
                <span id="mattCalorieTotal" class="text-base font-extrabold text-sky-700 leading-none">0</span>
                <span id="mattCalorieUnit" class="text-[10px] font-bold text-sky-600 block">kcal today</span>
              </div>
            </div>
            <button type="button" onclick="openSpareCalorieModal('Matt')" class="w-full bg-white text-sky-800 border border-sky-300 py-1.5 rounded-lg text-[11px] font-bold shadow-sm">✨ Fill Spare</button>
          </div>

          <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 space-y-2">
            <div class="flex items-start justify-between">
              <div>
                <span class="text-xs font-extrabold uppercase text-rose-800 block">👩 Lou</span>
                <span class="text-[10px] text-rose-600">Target: <b id="louTargetDisplay">1800 kcal</b></span>
              </div>
              <div class="text-right">
                <span id="louCalorieTotal" class="text-base font-extrabold text-rose-700 leading-none">0</span>
                <span id="louCalorieUnit" class="text-[10px] font-bold text-rose-600 block">kcal today</span>
              </div>
            </div>
            <button type="button" onclick="openSpareCalorieModal('Lou')" class="w-full bg-white text-rose-800 border border-rose-300 py-1.5 rounded-lg text-[11px] font-bold shadow-sm">✨ Fill Spare</button>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <h3 class="text-xs font-bold uppercase tracking-wider text-stone-500 px-1">⚡ Individual Logs</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-sky-200 space-y-2.5">
            <div class="flex items-center justify-between border-b border-sky-100 pb-2">
              <span class="font-extrabold text-xs text-sky-800">🧑 Matt's Log</span>
              <button type="button" onclick="openCalorieQuickModal('Matt')" class="bg-sky-600 text-white text-[11px] font-bold px-3 py-1 rounded-lg">+ Log</button>
            </div>
            <div id="mattSnacksList" class="space-y-1.5"></div>
          </div>
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-rose-200 space-y-2.5">
            <div class="flex items-center justify-between border-b border-rose-100 pb-2">
              <span class="font-extrabold text-xs text-rose-800">👩 Lou's Log</span>
              <button type="button" onclick="openCalorieQuickModal('Lou')" class="bg-rose-500 text-white text-[11px] font-bold px-3 py-1 rounded-lg">+ Log</button>
            </div>
            <div id="louSnacksList" class="space-y-1.5"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- RECIPES TAB -->
    <section id="tab-recipes" class="hidden space-y-3.5">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-stone-800">Our Recipe Book</h2>
        <button type="button" onclick="openRecipeForm()" class="bg-sage-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm">+ New Recipe</button>
      </div>
      <input type="text" id="recipeSearchInput" oninput="renderRecipes()" placeholder="🔍 Search recipes..." class="w-full bg-white px-4 py-3 rounded-xl border border-sage-200 text-sm shadow-sm" />
      <div id="recipesList" class="space-y-3"></div>
    </section>

    <!-- CALORIE BANK TAB -->
    <section id="tab-bank" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-sage-100 space-y-2">
        <h2 class="text-lg font-bold text-stone-800">Saved Calorie Bank</h2>
        <input id="bankFoodInput" type="text" placeholder="Food Name (e.g. Hobnob)" class="w-full px-3 py-2 rounded-lg border border-sage-200 text-sm bg-white" />
        <div class="grid grid-cols-2 gap-2">
          <input id="bankPortionInput" type="text" placeholder="Portion (1 biscuit)" class="px-3 py-2 rounded-lg border border-sage-200 text-sm bg-white" />
          <input id="bankCaloriesInput" type="number" placeholder="kcal" class="px-3 py-2 rounded-lg border border-sage-200 text-sm bg-white" />
        </div>
        <button type="button" onclick="saveManualBankItem()" class="w-full bg-sage-600 text-white py-2.5 rounded-lg font-semibold text-xs">Save to Bank</button>
      </div>
      <div id="calorieBankList" class="space-y-2"></div>
    </section>

    <!-- SHOPPING TAB -->
    <section id="tab-shopping" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border flex gap-2">
        <input id="newShopItemInput" type="text" onkeydown="if(event.key==='Enter') addShoppingItem()" placeholder="Add shopping item..." class="flex-1 px-3 py-2 rounded-xl border text-sm" />
        <button type="button" onclick="addShoppingItem()" class="bg-sage-600 text-white px-4 py-2 rounded-xl font-bold text-sm">Add</button>
      </div>
      <div id="shoppingActiveList" class="space-y-1.5"></div>
    </section>

    <!-- SETTINGS TAB -->
    <section id="tab-settings" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border space-y-3">
        <h2 class="text-lg font-bold text-stone-800">🎯 Daily Calorie Targets</h2>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-sky-50 p-3 rounded-xl border"><label class="block text-xs font-extrabold text-sky-800 mb-1">Matt</label><input id="mattTargetInput" type="number" value="2200" class="w-full px-3 py-1.5 rounded-lg border text-sm font-bold bg-white" /></div>
          <div class="bg-rose-50 p-3 rounded-xl border"><label class="block text-xs font-extrabold text-rose-800 mb-1">Lou</label><input id="louTargetInput" type="number" value="1800" class="w-full px-3 py-1.5 rounded-lg border text-sm font-bold bg-white" /></div>
        </div>
        <button type="button" onclick="saveSettings()" class="w-full bg-sage-600 text-white py-3 rounded-xl font-bold text-sm">Save Targets</button>
      </div>
    </section>
  </main>

  <!-- MODALS -->
  <div id="modalQuickCalorie" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
      <h3 class="font-bold text-lg">Log Food / Drink</h3>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="setQuickCaloriePerson('Matt')" id="btnQuickMatt" class="py-2 rounded-xl font-bold text-xs bg-sky-600 text-white">Matt</button>
        <button type="button" onclick="setQuickCaloriePerson('Lou')" id="btnQuickLou" class="py-2 rounded-xl font-bold text-xs bg-stone-100 text-stone-600">Lou</button>
        <button type="button" onclick="setQuickCaloriePerson('Both')" id="btnQuickBoth" class="py-2 rounded-xl font-bold text-xs bg-sage-600 text-white">Both</button>
      </div>
      <input id="quickFoodNameInput" type="text" placeholder="Food Name..." class="w-full px-3.5 py-2.5 rounded-xl border text-sm" />
      <div class="grid grid-cols-2 gap-2">
        <input id="quickFoodPortionInput" type="text" placeholder="Portion" class="px-3 py-2 rounded-xl border text-sm" />
        <input id="quickFoodCaloriesInput" type="number" placeholder="Total kcal" class="px-3 py-2 rounded-xl border text-sm font-bold" />
      </div>
      <button type="button" onclick="confirmQuickCalorieLog()" class="w-full bg-sage-600 text-white py-3 rounded-xl font-bold text-sm">Add to Daily Log</button>
      <button type="button" onclick="closeModal('modalQuickCalorie')" class="w-full bg-stone-100 text-stone-600 py-2 rounded-xl text-xs font-bold">Cancel</button>
    </div>
  </div>

  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-sage-200 z-40 shadow-lg">
    <div class="max-w-xl mx-auto grid grid-cols-5 text-center py-2">
      <button type="button" onclick="switchTab('diary')" id="nav-diary" class="flex flex-col items-center text-sage-600 font-bold"><span class="text-lg">📅</span><span class="text-[11px]">Diary</span></button>
      <button type="button" onclick="switchTab('recipes')" id="nav-recipes" class="flex flex-col items-center text-stone-400"><span class="text-lg">📖</span><span class="text-[11px]">Recipes</span></button>
      <button type="button" onclick="switchTab('bank')" id="nav-bank" class="flex flex-col items-center text-stone-400"><span class="text-lg">🔥</span><span class="text-[11px]">Bank</span></button>
      <button type="button" onclick="switchTab('shopping')" id="nav-shopping" class="flex flex-col items-center text-stone-400"><span class="text-lg">🛒</span><span class="text-[11px]">Shopping</span></button>
      <button type="button" onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-stone-400"><span class="text-lg">⚙️</span><span class="text-[11px]">Settings</span></button>
    </div>
  </nav>

  <script>
    const HARDCODED_URL = 'https://script.google.com/macros/s/AKfycbxQ-ziObHpTIVyawHp_ytEYX2j8hlX7E16ICJFmkuv39duUS6kdBSUSt9V_eC44-nvG/exec';

    let state = { recipes: [], diary: [], shopping: [], calorieBank: [], settings: { mattCalorieTarget: 2200, louCalorieTarget: 1800 } };
    let selectedDateStr = formatDateISO(new Date());
    let weekStartDate = getMonday(new Date());
    let currentQuickPerson = 'Matt';

    function getMonday(d) {
      const date = new Date(d); const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }
    function formatDateISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function initApp() {
      syncWithSheet();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
    else initApp();

    async function sendBackendAction(payload) {
      setSyncStatus('Syncing...', true);
      try {
        const res = await fetch(HARDCODED_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json && json.status === 'ok' && json.data) {
          state = json.data;
          renderAll();
          setSyncStatus('Synced with Sheet ✓', false);
        }
      } catch (err) {
        setSyncStatus('Offline (cached)', false);
      }
    }

    async function syncWithSheet() {
      setSyncStatus('Syncing...', true);
      try {
        const res = await fetch(HARDCODED_URL + '?action=loadAll');
        const json = await res.json();
        if (json && json.status === 'ok' && json.data) {
          state = json.data;
          renderAll();
          setSyncStatus('Synced with Sheet ✓', false);
        }
      } catch (e) {
        setSyncStatus('Offline (cached)', false);
      }
    }

    function setSyncStatus(msg, spinning) {
      document.getElementById('syncStatusText').textContent = msg;
      document.getElementById('syncSpinner').textContent = spinning ? '⏳' : '🔄';
    }

    function switchTab(tab) {
      ['diary', 'recipes', 'bank', 'shopping', 'settings'].forEach(function(t) {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('nav-' + t).className = (t === tab) ? 'flex flex-col items-center text-sage-600 font-bold' : 'flex flex-col items-center text-stone-400';
      });
      renderAll();
    }

    function renderAll() {
      renderWeekStrip();
      renderDiary();
      renderRecipes();
      renderCalorieBank();
    }

    function renderWeekStrip() {
      const strip = document.getElementById('weekStrip');
      strip.innerHTML = '';
      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      document.getElementById('currentMonthLabel').textContent = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' }).format(weekStartDate);
      document.getElementById('fullDatePicker').value = selectedDateStr;

      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStartDate); d.setDate(d.getDate() + i);
        const dStr = formatDateISO(d);
        const isSel = dStr === selectedDateStr;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = function() { selectedDateStr = dStr; renderAll(); };
        btn.className = 'py-2 rounded-xl flex flex-col items-center ' + (isSel ? 'bg-sage-600 text-white font-bold shadow-sm' : 'bg-sage-50 text-stone-700');
        btn.innerHTML = '<span class="text-[10px] uppercase opacity-80">' + dayNames[i] + '</span><span class="text-sm font-bold mt-0.5">' + d.getDate() + '</span>';
        strip.appendChild(btn);
      }
    }

    function shiftWeek(days) {
      weekStartDate.setDate(weekStartDate.getDate() + days);
      selectedDateStr = formatDateISO(weekStartDate);
      renderAll();
    }
    function jumpToDate(val) {
      if (!val) return;
      selectedDateStr = val;
      weekStartDate = getMonday(new Date(val + 'T12:00:00'));
      renderAll();
    }

    function renderDiary() {
      const dateObj = new Date(selectedDateStr + 'T12:00:00');
      const readable = dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
      document.getElementById('selectedDateReadable').textContent = readable;
      document.getElementById('selectedDateReadableMeals').textContent = readable;

      const dayEntries = (state.diary || []).filter(function(e) { return e.dateStr === selectedDateStr; });
      const mattTotal = dayEntries.filter(function(e) { return e.person === 'Matt' || e.person === 'Both'; }).reduce(function(s, e) { return s + (Number(e.totalCalories) || 0); }, 0);
      const louTotal = dayEntries.filter(function(e) { return e.person === 'Lou' || e.person === 'Both'; }).reduce(function(s, e) { return s + (Number(e.totalCalories) || 0); }, 0);

      const mattT = Number(state.settings.mattCalorieTarget) || 2200;
      const louT = Number(state.settings.louCalorieTarget) || 1800;

      document.getElementById('mattTargetDisplay').textContent = mattT + ' kcal';
      document.getElementById('louTargetDisplay').textContent = louT + ' kcal';
      document.getElementById('mattCalorieTotal').textContent = mattTotal;
      document.getElementById('louCalorieTotal').textContent = louTotal;

      renderPersonSnackColumn('mattSnacksList', dayEntries.filter(function(e) { return e.person === 'Matt' || e.person === 'Both'; }));
      renderPersonSnackColumn('louSnacksList', dayEntries.filter(function(e) { return e.person === 'Lou' || e.person === 'Both'; }));
    }

    function renderPersonSnackColumn(id, items) {
      const box = document.getElementById(id);
      if (items.length === 0) { box.innerHTML = '<p class="text-[11px] text-stone-400 italic py-2 text-center">Nothing logged.</p>'; return; }
      box.innerHTML = items.map(function(item) {
        return '<div class="bg-stone-50 p-2 rounded-xl border flex justify-between items-center text-xs"><span><b>' + escapeHtml(item.title) + '</b> (' + item.totalCalories + ' kcal)</span><button type="button" onclick="deleteDiaryItem(\'' + item.id + '\')" class="text-red-400 font-bold">×</button></div>';
      }).join('');
    }

    function openCalorieQuickModal(person) {
      currentQuickPerson = person;
      document.getElementById('btnQuickMatt').className = person === 'Matt' ? 'py-2 rounded-xl font-bold text-xs bg-sky-600 text-white' : 'py-2 rounded-xl font-bold text-xs bg-stone-100 text-stone-600';
      document.getElementById('btnQuickLou').className = person === 'Lou' ? 'py-2 rounded-xl font-bold text-xs bg-rose-500 text-white' : 'py-2 rounded-xl font-bold text-xs bg-stone-100 text-stone-600';
      document.getElementById('btnQuickBoth').className = person === 'Both' ? 'py-2 rounded-xl font-bold text-xs bg-sage-600 text-white' : 'py-2 rounded-xl font-bold text-xs bg-stone-100 text-stone-600';
      document.getElementById('modalQuickCalorie').classList.remove('hidden');
    }
    function setQuickCaloriePerson(p) { openCalorieQuickModal(p); }

    function confirmQuickCalorieLog() {
      const name = document.getElementById('quickFoodNameInput').value.trim();
      const cals = Number(document.getElementById('quickFoodCaloriesInput').value) || 0;
      if (!name) return alert('Enter food name');
      const entry = { id: 'diary_' + Date.now(), dateStr: selectedDateStr, entryType: 'snack', title: name, totalCalories: cals, person: currentQuickPerson };
      state.diary.push(entry);
      sendBackendAction({ action: 'addDiaryEntry', entry: entry });
      closeModal('modalQuickCalorie');
    }

    async function deleteDiaryItem(id) {
      state.diary = (state.diary || []).filter(function(e) { return e.id !== id; });
      renderAll();
      sendBackendAction({ action: 'deleteDiaryEntry', id: id });
    }

    function renderRecipes() {
      const list = document.getElementById('recipesList');
      list.innerHTML = (state.recipes || []).map(function(r) {
        return '<div class="bg-white p-3 rounded-xl border flex justify-between items-center"><span><b>' + escapeHtml(r.title) + '</b></span></div>';
      }).join('') || '<p class="text-xs text-stone-400">No recipes.</p>';
    }

    function renderCalorieBank() {
      const list = document.getElementById('calorieBankList');
      list.innerHTML = (state.calorieBank || []).map(function(i) {
        return '<div class="bg-white p-3 rounded-xl border flex justify-between items-center text-xs"><span>' + escapeHtml(i.foodName) + ' (' + i.calories + ' kcal)</span><button type="button" onclick="deleteBankItem(\'' + i.id + '\')" class="text-red-400 font-bold">🗑️</button></div>';
      }).join('') || '<p class="text-xs text-stone-400">Bank is empty.</p>';
    }

    function deleteBankItem(id) {
      state.calorieBank = (state.calorieBank || []).filter(function(i) { return i.id !== id; });
      renderAll();
      sendBackendAction({ action: 'deleteCalorieBankItem', id: id });
    }

    function saveManualBankItem() {
      const name = document.getElementById('bankFoodInput').value.trim();
      const port = document.getElementById('bankPortionInput').value.trim() || '1 serving';
      const cals = Number(document.getElementById('bankCaloriesInput').value) || 0;
      if (!name || !cals) return;
      const item = { id: 'cb_' + Date.now(), foodName: name, portionDescription: port, calories: cals };
      state.calorieBank.push(item);
      sendBackendAction({ action: 'saveCalorieBankItem', item: item });
      document.getElementById('bankFoodInput').value = '';
      document.getElementById('bankCaloriesInput').value = '';
    }

    function saveSettings() {
      const mattT = Number(document.getElementById('mattTargetInput').value) || 2200;
      const louT = Number(document.getElementById('louTargetInput').value) || 1800;
      state.settings.mattCalorieTarget = mattT;
      state.settings.louCalorieTarget = louT;
      sendBackendAction({ action: 'saveTargets', mattCalorieTarget: mattT, louCalorieTarget: louT });
      alert('Targets saved!');
    }

    function openRecipeForm() { alert('Recipe modal shortcut'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, function(m) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]; }); }
  </script>
</body>
</html>
